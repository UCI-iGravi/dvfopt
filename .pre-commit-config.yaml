# Pre-commit hooks. Install with:
#     pip install pre-commit && pre-commit install
#
# Then every `git commit` runs these checks; commit is blocked if any
# fail. Run manually with `pre-commit run --all-files`.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=10240']        # 10MB cap on accidentally-added blobs
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Keep in lockstep with the ruff pin in pyproject.toml [dev] extra, so
    # local pre-commit and CI (`.[dev]` → ruff 0.15.21) lint identically.
    rev: v0.15.21
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        # Strip notebook outputs on commit. Comment out if you want the
        # outputs in version control.
        files: '\.ipynb$'
