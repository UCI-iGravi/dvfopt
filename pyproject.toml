[project]
name = "dvfopt"
version = "0.5.0"
description = "Correction of negative Jacobian determinants in deformation (displacement) fields"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.15,<1.19",
    "SimpleITK",
    "nibabel",
    "matplotlib",
    "scikit-image",
]

[project.scripts]
dvfopt = "dvfopt.cli:main"

[project.optional-dependencies]
benchmarks = [
    "itk-elastix",
    "opencv-python-headless",
    "timm",
    "torch",
    "tqdm",           # benchmarks/registration/transmorph-registration.ipynb imports it directly
    "voxelmorph",
    # pyslsqp is intentionally omitted: it ships wheels only for Python <=3.12,
    # so declaring it would break installs on 3.13+. Install it manually in a
    # py<=3.12 env to enable the 'pyslsqp' solver option.
]
dev = [
    "pytest>=7",
    "pytest-xdist>=3",       # parallel test execution: `pytest -n auto`
    "pytest-cov>=5",         # coverage: `pytest --cov=dvfopt`
    "pytest-randomly>=3",    # shuffle test order to surface order-dependencies
    "ruff==0.16.3",
    "mypy>=1.11",            # static type checks (see [tool.mypy]; scoped to clean modules)
    "nox>=2024",             # task runner (see noxfile.py)
    "pre-commit>=3",
    "hypothesis>=6",
    "nbformat>=5",
    "pandas",
    "osqp",                  # windowed isqp inner — CI's [dev,gui] legs run the no-damage suite
]
perf = [
    # Airspeed Velocity — solver performance regression tracking.
    # `asv run` builds isolated envs per commit; not run in CI (too slow).
    "asv>=0.6",
]
solvers = [
    # OSQP — the elastic-QP inner behind the windowed engine (ISQPWindowedStrategy).
    "osqp",
]
gui = [
    # Live-visualisation app (``dvfopt_gui``). Standalone — only needed
    # if you want the PyQtGraph GUI; not pulled in by ``pip install -e .``.
    "pyside6",
    "pyqtgraph",
]
fast = [
    # Optional JIT accelerator for the hot 2-triangle adjoint
    # (`dvfopt.core.primitives.tri.tri_grad_T_v`). Provides a 5-14x
    # per-call speedup; the module auto-detects numba at import and
    # falls back to the pure-numpy path when not installed.
    "numba",
]

[tool.setuptools.packages.find]
include = ["dvfopt*", "dvfopt_gui*"]

# ---------------------------------------------------------------------------
# Pytest. Scope collection to tests/ so a bare `pytest` does NOT pull in the
# notebooks/experiments/_run_*_test.py scratch scripts (they load gitignored
# data at import time and error at collection). Matches CI's `pytest tests/`.
# pytest-randomly (dev extra) shuffles test order each run and prints the seed
# — reproduce a failure with `pytest -p randomly --randomly-seed=<seed>`.
# Parallelize with `pytest -n auto` (pytest-xdist).
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true

# ---------------------------------------------------------------------------
# mypy: static type checks. Lenient + scoped — the numpy-heavy solver core is
# not yet annotated for strict checking, so we gate only the cleanly-typed
# newer modules and expand as annotations land. Run with `mypy` (no args).
# ---------------------------------------------------------------------------
[tool.mypy]
# No python_version pin: mypy uses the running interpreter's version, so it
# parses the installed numpy/... stubs natively. Pinning an older version made
# mypy choke on numpy's 3.12-syntax stubs (`type X = ...`) on the 3.12 CI leg.
ignore_missing_imports = true      # numpy/scipy/SimpleITK ship incomplete stubs
# Only REPORT on the listed files; follow imports for types but stay silent on
# the (not-yet-annotated) modules they pull in — so this gate covers the clean
# newer surface and grows as `files` grows, without drowning in transitive noise.
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
files = ["dvfopt/cli.py", "dvfopt/metrics.py", "dvfopt/io"]

# ---------------------------------------------------------------------------
# Ruff: lint + format. Run with `ruff check --fix` and `ruff format`.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
# Deliberately trails `requires-python` (>=3.10): raising this to py310 turns
# on ~30 pyupgrade/RUF findings that are code changes, not packaging truth.
target-version = "py39"
extend-exclude = [
    "archive/**",                    # historical, do not lint
    ".venv/**",
    "**/*.ipynb",                    # notebook cell scoping confuses static analysis
    "notebooks/**",                  # notebook-exported .py have the same cell-scoping issues (F821, E402)
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear (likely bugs)
    "W",    # pycodestyle warnings
    "RUF",  # ruff-specific
    "SIM",  # simplify
    "PIE",  # picky-flake8
]
ignore = [
    "E501",   # line-too-long — covered by formatter
    "E701",   # one-line `if x: y` — common in math code
    "E702",   # one-line `x = ...; y = ...` — common in numpy-heavy code
    "E741",   # ambiguous variable name (intentional in math: i, l, m, ...)
    "B008",   # function call in default arg — used for dataclass defaults
    "B023",   # closure over loop variable — common in lazy strategy lambdas
    "B028",   # warnings.warn without stacklevel
    "SIM102", # collapsible if (sometimes the nested form is clearer)
    "SIM108", # if/else -> ternary
    "SIM105", # contextlib.suppress — try/except is often clearer
    "UP007",  # X | Y typing on Python 3.9
    "UP045",  # X | None typing on Python 3.9
    "RUF001", # ambiguous unicode in strings (we use × and — in docstrings)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF012", # mutable class attrs (intentional class-level defaults)
    "RUF059", # unused unpacked variable (common in (val, _) idioms)
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]      # test fixtures often look unused
# importorskip('torch') must run BEFORE importing the module under test.
"tests/test_gpu_untangle.py" = ["E402"]
# importorskip('SimpleITK') must run BEFORE importing the module under test.
"tests/test_io_fields.py" = ["E402"]
# importorskip('hypothesis') must run BEFORE the hypothesis imports.
"tests/test_constraint_properties.py" = ["E402"]
"**/conftest.py" = ["F401"]
"scripts/**" = ["E402", "F401", "SIM115", "RUF005", "F841"]  # probes are scratch code
"notebooks/experiments/_run_*.py" = ["E402"]
# Legacy benchmark scratch scripts — sys.path mutation before imports
# is the intended pattern; the runtime path math lives there.
"benchmarks/scripts/_run_*.py" = ["E402"]
"benchmarks/scripts/_full_volume_parallel.py" = ["E402"]
"benchmarks/scripts/_*.py" = ["E402"]
# GUI package: ``__init__.py`` re-exports ``LiveSolverWindow`` and
# ``launch`` without using them locally, so F401 fires there. Scoped to
# the init module only so the rest of the package gets normal
# unused-import detection.
"dvfopt_gui/__init__.py" = ["F401"]
# Research scripts are scratch/exploratory code (same rationale as
# ``scripts/**`` above): sys.path setup before imports (E402), and
# unused imports/vars/loop-vars (F401/F841/B007) are expected noise.
"research/**" = ["E402", "F401", "F841", "B007"]
# laplacian package: ``__init__`` re-exports the public API; F821 in
# ``correspondence.py`` is a false positive on closure free-variables
# (``A``/``M`` are bound in the enclosing ``sliceToSlice3DLaplacian``).
"dvfopt/laplacian/__init__.py" = ["F401"]
"dvfopt/laplacian/correspondence.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["dvfopt", "dvfopt_gui"]

[tool.ruff.format]
quote-style = "preserve"  # don't auto-rewrite quotes (codebase uses both)
