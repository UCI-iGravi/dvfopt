[project]
name = "dvfopt"
version = "0.3.0"
description = "Correction of negative Jacobian determinants in deformation (displacement) fields"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "SimpleITK",
    "nibabel",
    "matplotlib",
    "scikit-image",
    "joblib",
    "tqdm",
]

[project.scripts]
dvfopt = "dvfopt.cli:main"

[project.optional-dependencies]
benchmarks = [
    "itk-elastix",
    "opencv-python-headless",
    "timm",
    "torch",
    "voxelmorph",
]
dev = [
    "pytest>=7",
    "ruff==0.15.21",
    "pre-commit>=3",
    "hypothesis>=6",
    "nbformat>=5",
    "pandas",
]
gui = [
    # Live-visualisation app (``dvfopt_gui``). Standalone — only needed
    # if you want the PyQtGraph GUI; not pulled in by ``pip install -e .``.
    "pyqt5",
    "pyqtgraph",
]
fast = [
    # Optional JIT accelerator for the hot 2-triangle adjoint
    # (`dvfopt.core.tri_primitives.tri_grad_T_v`). Provides a 5-14x
    # per-call speedup; the module auto-detects numba at import and
    # falls back to the pure-numpy path when not installed.
    "numba",
]

[tool.setuptools.packages.find]
include = ["dvfopt*", "laplacian*", "test_cases*", "dvfopt_gui*"]

# ---------------------------------------------------------------------------
# Ruff: lint + format. Run with `ruff check --fix` and `ruff format`.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "archive/**",                    # historical, do not lint
    ".venv/**",
    "**/*.ipynb",                    # notebook cell scoping confuses static analysis
    "notebooks/**",                  # notebook-exported .py have the same cell-scoping issues (F821, E402)
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear (likely bugs)
    "W",    # pycodestyle warnings
    "RUF",  # ruff-specific
    "SIM",  # simplify
    "PIE",  # picky-flake8
]
ignore = [
    "E501",   # line-too-long — covered by formatter
    "E701",   # one-line `if x: y` — common in math code
    "E702",   # one-line `x = ...; y = ...` — common in numpy-heavy code
    "E741",   # ambiguous variable name (intentional in math: i, l, m, ...)
    "B008",   # function call in default arg — used for dataclass defaults
    "B023",   # closure over loop variable — common in lazy strategy lambdas
    "B028",   # warnings.warn without stacklevel
    "SIM102", # collapsible if (sometimes the nested form is clearer)
    "SIM108", # if/else -> ternary
    "SIM105", # contextlib.suppress — try/except is often clearer
    "UP007",  # X | Y typing on Python 3.9
    "UP045",  # X | None typing on Python 3.9
    "RUF001", # ambiguous unicode in strings (we use × and — in docstrings)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
    "RUF012", # mutable class attrs (intentional class-level defaults)
    "RUF059", # unused unpacked variable (common in (val, _) idioms)
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F811"]      # test fixtures often look unused
# importorskip('torch') must run BEFORE importing the module under test.
"tests/test_gpu_untangle.py" = ["E402"]
# importorskip('SimpleITK') must run BEFORE importing the module under test.
"tests/test_io_fields.py" = ["E402"]
# importorskip('hypothesis') must run BEFORE the hypothesis imports.
"tests/test_constraint_properties.py" = ["E402"]
"**/conftest.py" = ["F401"]
"scripts/**" = ["E402", "F401", "SIM115", "RUF005", "F841"]  # probes are scratch code
"notebooks/experiments/_run_*.py" = ["E402"]
# Legacy benchmark scratch scripts — sys.path mutation before imports
# is the intended pattern; the runtime path math lives there.
"benchmarks/scripts/_run_*.py" = ["E402"]
"benchmarks/scripts/_full_volume_parallel.py" = ["E402"]
"benchmarks/scripts/_*.py" = ["E402"]
# GUI package: ``__init__.py`` re-exports ``LiveSolverWindow`` and
# ``launch`` without using them locally, so F401 fires there. Scoped to
# the init module only so the rest of the package gets normal
# unused-import detection.
"dvfopt_gui/__init__.py" = ["F401"]
# Research scripts are scratch/exploratory code (same rationale as
# ``scripts/**`` above): sys.path setup before imports (E402), and
# unused imports/vars/loop-vars (F401/F841/B007) are expected noise.
"research/**" = ["E402", "F401", "F841", "B007"]
# laplacian package: ``__init__`` re-exports the public API; F821 in
# ``correspondence.py`` is a false positive on closure free-variables
# (``A``/``M`` are bound in the enclosing ``sliceToSlice3DLaplacian``).
"laplacian/__init__.py" = ["F401"]
"laplacian/correspondence.py" = ["F821"]

[tool.ruff.lint.isort]
known-first-party = ["dvfopt", "dvfopt_gui", "laplacian", "test_cases"]

[tool.ruff.format]
quote-style = "preserve"  # don't auto-rewrite quotes (codebase uses both)
