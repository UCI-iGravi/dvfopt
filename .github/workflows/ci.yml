name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (core + numba)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast]" pytest
      # Persist Numba's on-disk JIT cache across runs so @njit kernels
      # load precompiled instead of recompiling per run/worker. Measured
      # effect is minor — the leg's historical 30-min cost was prange
      # sync overhead, fixed by NUMBA_NUM_THREADS=1 below (PR #37) — but
      # the cache is near-free and shaves the residual compile time.
      # Numba validates entries against the source, so a stale restore
      # is harmless — hence the loose restore-keys fallback.
      - name: Restore Numba JIT cache
        uses: actions/cache@v6
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('dvfopt/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py${{ matrix.python-version }}-
      # Numba validates cache entries against the source file's
      # (mtime, size) stamp, and actions/checkout rewrites mtimes on
      # every run — without normalization the restored cache is always
      # judged stale and every kernel recompiles anyway. Pin all source
      # mtimes to a constant so the stamps match across runs.
      - name: Normalize source mtimes for the Numba cache
        run: git ls-files -z '*.py' | xargs -0 touch -d '2000-01-01T00:00:00Z'
      - name: Run test suite
        # GUI tests importorskip PyQt5; torch-gated tests skip without torch;
        # research worst-case tests skip without the optional data folders.
        env:
          NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
          # Confirmed fix (PR #37: 30m27s -> 4m03s, ~8x): the suite
          # makes thousands of prange-kernel calls on tiny test arrays,
          # and the per-call 4-thread fork/join + OpenMP spin-wait
          # dwarfed the actual work on 4-vCPU runners. threads=1 removes
          # every parallel-region barrier. Production-sized volumes are
          # unaffected (this env only applies to the CI test run).
          NUMBA_NUM_THREADS: '1'
        run: python -m pytest tests/ -q
