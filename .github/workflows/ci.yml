name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (core + numba)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast]" pytest
      - name: Run test suite
        # GUI tests importorskip PyQt5; torch-gated tests skip without torch;
        # research worst-case tests skip without the optional data folders.
        run: python -m pytest tests/ -q
