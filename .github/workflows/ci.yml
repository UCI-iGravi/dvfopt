name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package (core + numba)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[fast]" pytest
      # Persist Numba's on-disk JIT cache across runs. Without it every CI
      # run re-compiles all @njit kernels from scratch (in the main process
      # AND each spawned pool worker), which made this numba leg ~3.7x
      # slower than the numba-less test.yml leg (26 min vs 7 min). Numba's
      # cache is content-addressed (it validates against the source), so a
      # stale restore is harmless — hence the loose restore-keys fallback.
      - name: Restore Numba JIT cache
        uses: actions/cache@v4
        with:
          path: .numba_cache
          key: numba-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('dvfopt/**/*.py') }}
          restore-keys: |
            numba-${{ runner.os }}-py${{ matrix.python-version }}-
      # Numba validates cache entries against the source file's
      # (mtime, size) stamp, and actions/checkout rewrites mtimes on
      # every run — without normalization the restored cache is always
      # judged stale and every kernel recompiles anyway. Pin all source
      # mtimes to a constant so the stamps match across runs.
      - name: Normalize source mtimes for the Numba cache
        run: git ls-files -z '*.py' | xargs -0 touch -d '2000-01-01T00:00:00Z'
      - name: Run test suite
        # GUI tests importorskip PyQt5; torch-gated tests skip without torch;
        # research worst-case tests skip without the optional data folders.
        env:
          NUMBA_CACHE_DIR: ${{ github.workspace }}/.numba_cache
        run: python -m pytest tests/ -q
