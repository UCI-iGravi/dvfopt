name: Tests

"on":
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # Editable install with dev extras (pytest, ruff, hypothesis).
          pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check dvfopt dvfopt_gui tests benchmarks

      - name: Format check
        run: python -m ruff format --check dvfopt dvfopt_gui tests benchmarks

      - name: Type check (scoped; see [tool.mypy] in pyproject.toml)
        run: python -m mypy

      - name: Tests
        # Serial on CI: the few-core runners' per-worker import overhead
        # outweighs xdist parallelism here (it helps on many-core dev boxes —
        # `pytest -n auto`). pytest-randomly still shuffles order each run.
        run: python -m pytest tests/ -q

      - name: CLI smoke (installed entry point)
        run: |
          dvfopt --help
          python -c "import numpy as np; np.save('flat.npy', np.zeros((2, 8, 8)))"
          dvfopt info flat.npy --check

  coverage:
    # Coverage report (single Python; non-blocking — no threshold gate yet).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests with coverage
        run: python -m pytest tests/ -q -p no:randomly --cov=dvfopt --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  benchmark-smoke:
    # Smoke-test that the benchmark scripts can still import.
    # (Doesn't actually run the long benchmarks.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Import each benchmark script
        run: |
          # Legacy run scripts live under benchmarks/scripts/ after the
          # 2026 workspace reorganization (commit b637ec4 / PR #19).
          for f in benchmarks/scripts/_run_*.py; do
            python -c "import py_compile; py_compile.compile('$f', doraise=True)"
          done
