name: Tests

"on":
  push:
    branches: [main, nightly]
  pull_request:
    branches: [main, nightly]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # Guard: fail if uv.lock has drifted from pyproject's declared
      # constraints (won't trip on routine unpinned-dep releases, only on
      # constraint edits that weren't re-locked).
      - name: Check lockfile is up to date
        run: uv lock --check

      - name: Qt headless system libs (for the GUI tests)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      - name: Install
        # Editable install with dev + gui extras (pytest, ruff, hypothesis,
        # PySide6 — the GUI tests run offscreen; conftest sets QT_QPA_PLATFORM).
        run: uv pip install --system -e ".[dev,gui]"

      - name: Lint
        run: python -m ruff check dvfopt dvfopt_gui tests benchmarks

      - name: Format check
        run: python -m ruff format --check dvfopt dvfopt_gui tests benchmarks

      - name: Type check (scoped; see [tool.mypy] in pyproject.toml)
        run: python -m mypy

      - name: Tests
        # Serial on CI: the few-core runners' per-worker import overhead
        # outweighs xdist parallelism here (it helps on many-core dev boxes —
        # `pytest -n auto`). pytest-randomly still shuffles order each run.
        run: python -m pytest tests/ -q

      - name: CLI smoke (installed entry point)
        run: |
          dvfopt --help
          python -c "import numpy as np; np.save('flat.npy', np.zeros((2, 8, 8)))"
          dvfopt info flat.npy --check

  coverage:
    # Coverage report (single Python; non-blocking — no threshold gate yet).
    # This leg installs from uv.lock (`uv sync --locked`) so the committed
    # lockfile is actually exercised in CI, not just carried along.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Qt headless system libs (for the GUI tests)
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0

      - name: Sync locked env (dev + gui extras)
        run: uv sync --locked --extra dev --extra gui
      - name: Tests with coverage
        run: uv run pytest tests/ -q -p no:randomly --cov=dvfopt --cov-report=term-missing --cov-report=xml
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  benchmark-smoke:
    # Smoke-test that the benchmark scripts can still import.
    # (Doesn't actually run the long benchmarks.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv pip install --system -e ".[dev]"
      - name: Import each benchmark script
        run: |
          # Legacy run scripts live under benchmarks/scripts/ after the
          # 2026 workspace reorganization (commit b637ec4 / PR #19).
          for f in benchmarks/scripts/_run_*.py; do
            python -c "import py_compile; py_compile.compile('$f', doraise=True)"
          done
